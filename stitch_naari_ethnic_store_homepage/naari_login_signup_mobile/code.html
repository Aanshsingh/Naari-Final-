<script>
        function switchTab(tab) {
            const loginSection = document.getElementById('login-section');
            const signupSection = document.getElementById('signup-section');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');

            if (tab === 'login') {
                loginSection.classList.remove('hidden');
                signupSection.classList.add('hidden');
                tabLogin.classList.add('tab-active');
                tabLogin.classList.remove('text-on-surface-variant');
                tabSignup.classList.remove('tab-active');
                tabSignup.classList.add('text-on-surface-variant');
            } else {
                loginSection.classList.add('hidden');
                signupSection.classList.remove('hidden');
                tabSignup.classList.add('tab-active');
                tabSignup.classList.remove('text-on-surface-variant');
                tabLogin.classList.remove('tab-active');
                tabLogin.classList.add('text-on-surface-variant');
            }
        }

        // Add micro-interactions for input focus
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('soft-gold-glow');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('soft-gold-glow');
            });
        });
    </script>
