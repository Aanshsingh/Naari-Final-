<style>

            vertical-align: middle;
        }

        .gold-border {
            border: 1px solid transparent;
            background-image: linear-gradient(#111319, #111319), linear-gradient(135deg, #f5bd53 0%, #4f4536 100%);
            background-origin: border-box;
            background-clip: padding-box, border-box;

        }

            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0c0e14; }

</div>
<!-- Floating Quote -->

<!-- Tabs -->

<p class="font-label-sm text-[10px] text-on-surface-variant/40 leading-relaxed max-w-xs mx-auto">

<div class="absolute bottom-0 left-0 w-1/3 h-1/3 bg-secondary/5 blur-[120px] rounded-full"></div>

<script>
        function switchAuth(mode) {
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const fieldName = document.getElementById('field-name');
            const loginExtras = document.getElementById('login-extras');
            const authTitle = document.getElementById('auth-title');
            const authSubtitle = document.getElementById('auth-subtitle');
            const btnText = document.getElementById('btn-text');
            const form = document.getElementById('auth-form');

            // Apply fade effect to form fields
            form.classList.add('opacity-0');
            
            setTimeout(() => {
                if (mode === 'signup') {
                    // Update Tabs
                    tabLogin.classList.remove('text-primary', 'border-primary', 'border-b-2');
                    tabLogin.classList.add('text-on-surface-variant');
                    tabSignup.classList.add('text-primary', 'border-primary', 'border-b-2');
                    tabSignup.classList.remove('text-on-surface-variant');

                    // Update Texts
                    authTitle.innerText = "Join the Circle";
                    authSubtitle.innerText = "Create an account to experience the heritage of Naari.";
                    btnText.innerText = "Create Account";

                    // Toggle Fields
                    fieldName.classList.remove('hidden');
                    fieldName.classList.add('block');
                    setTimeout(() => fieldName.classList.add('opacity-100'), 50);
                    loginExtras.classList.add('hidden');
                } else {
                    // Update Tabs
                    tabSignup.classList.remove('text-primary', 'border-primary', 'border-b-2');
                    tabSignup.classList.add('text-on-surface-variant');
                    tabLogin.classList.add('text-primary', 'border-primary', 'border-b-2');
                    tabLogin.classList.remove('text-on-surface-variant');

                    // Update Texts
                    authTitle.innerText = "Welcome Back";
                    authSubtitle.innerText = "Enter your details to access your curated wardrobe.";
                    btnText.innerText = "Sign In";

                    // Toggle Fields
                    fieldName.classList.remove('opacity-100');
                    setTimeout(() => {
                        fieldName.classList.remove('block');
                        fieldName.classList.add('hidden');
                    }, 500);
                    loginExtras.classList.remove('hidden');
                }
                form.classList.remove('opacity-0');
            }, 300);
        }

        // Add subtle mouse-tracking glow to buttons
        document.querySelectorAll('.gold-glow').forEach(button => {
            button.addEventListener('mousemove', e => {
                const rect = button.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                button.style.setProperty('--x', `${x}px`);
                button.style.setProperty('--y', `${y}px`);
            });
        });
    </script>
</body></html>
